name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viva
          POSTGRES_PASSWORD: viva_ci_password
          POSTGRES_DB: viva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viva -d viva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://viva:viva_ci_password@localhost:5432/viva_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env.test (banco do serviço e segredo aleatório)
        run: |
          cat > .env.test <<EOF
          DATABASE_URL="${DATABASE_URL}"
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          BETTER_AUTH_URL="http://localhost:3100"
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Testes de integração
        run: npm run test:integration

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (build de produção)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Resultados do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção (sem segredos nem banco)
        run: docker build --target runner -t viva:ci .
